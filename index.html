<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>Sana's Web Designs — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Sana's Web Designs home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 2.5 19.1 12l9.4 4-9.4 4L16 29.5 12.9 20l-9.4-4 9.4-4L16 2.5Z" />
            </svg>
          </span>
          <span>SANA'S WEB DESIGNS</span>
        </a>

        <a class="social-link" href="mailto:hello@sanaswebdesigns.com">
          <span>Say hello</span>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 13 13 3M5 3h8v8" />
          </svg>
        </a>
      </nav>

      <section class="hero">
        <div class="eyebrow">
          <span class="eyebrow-dot"></span>
          <span>New things are on the horizon</span>
        </div>

        <h1>
          Something <em>wonderful</em><br />
          is coming soon.
        </h1>

        <p class="intro">
          We’re building a new kind of creative studio—one that turns bold ideas
          into meaningful experiences.
        </p>

        <form class="signup" id="signup-form">
          <label class="sr-only" for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Your email address"
            autocomplete="email"
            required
          />
          <button type="submit">
            <span>Notify me</span>
            <svg viewBox="0 0 18 18" aria-hidden="true">
              <path d="M3.5 9h11M10 4.5 14.5 9 10 13.5" />
            </svg>
          </button>
        </form>
        <p class="form-message" id="form-message" role="status"></p>

        <div class="orbit" aria-hidden="true">
          <div class="orbit-ring orbit-ring-one"></div>
          <div class="orbit-ring orbit-ring-two"></div>
          <div class="orbit-glow"></div>
          <svg class="orbit-star" viewBox="0 0 32 32">
            <path d="M16 2.5 19.1 12l9.4 4-9.4 4L16 29.5 12.9 20l-9.4-4 9.4-4L16 2.5Z" />
          </svg>
        </div>
      </section>

      <footer>
        <p>© 2026 Sana's Web Designs</p>
        <div class="footer-status">
          <span class="status-dot"></span>
          <span>Crafting something special</span>
        </div>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
